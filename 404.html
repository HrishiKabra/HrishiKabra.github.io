<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Hrishi Kabra</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<meta name="theme-color" content="#F5F0E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1A14" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#F5F0E8;--ink:#1C1C1A;--sub:#5C5A54;--accent:#4A7C59;--accent-deep:#3A6347;--line:rgba(28,28,26,.14)}
@media(prefers-color-scheme:dark){:root{--bg:#1A1A14;--ink:#F0EBE0;--sub:#A8A398;--accent:#7BAE8A;--accent-deep:#8FC09E;--line:rgba(240,235,224,.14)}}
*{margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);min-height:100vh;min-height:100dvh;display:flex;
  align-items:center;justify-content:center;font-family:'Fraunces',Georgia,serif;padding:24px}
main{text-align:center;max-width:34em}
h1{font-weight:440;font-size:clamp(64px,14vw,150px);line-height:1;letter-spacing:-.02em}
h1 em{font-style:italic;color:var(--accent)}
p{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--sub);margin-top:22px;line-height:1.8}
a{display:inline-flex;margin-top:30px;background:var(--accent);color:#fff;text-decoration:none;
  font-family:-apple-system,'Helvetica Neue',sans-serif;font-size:14.5px;font-weight:500;
  padding:14px 26px;border-radius:999px;border:1px solid var(--accent);
  transition:background .2s ease,transform .2s ease}
a:hover{background:var(--accent-deep);border-color:var(--accent-deep);transform:translateY(-1px)}
a:active{transform:translateY(0) scale(.98)}
@media(prefers-color-scheme:dark){a{color:#1A1A14}}
</style>
</head>
<body>
<main>
  <h1>4<em>0</em>4.</h1>
  <p>visitor@hrishikabra.me ~ % cat this-page<br>cat: this-page: No such file or directory</p>
  <a href="/">cd ~ (back home)</a>
</main>
</body>
</html>
